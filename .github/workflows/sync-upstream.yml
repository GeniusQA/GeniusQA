name: Sync Upstream

# 触发方式：
#   1. 定时：每天 UTC 10 点（北京时间 18:00）自动执行
#   2. 手动：在 Actions 页面点 "Run workflow"
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

# 允许工作流推送回当前仓库
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # 拉全量历史，保证三方合并可行

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream into main
        run: |
          # 上游地址（若以后变更，只改这一行）
          UPSTREAM_REPO="https://github.com/rebort-hub/N-Tester.git"
          UPSTREAM_BRANCH="main"

          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream

          echo "== 当前分支 =="
          git branch --show-current

          echo "== 合并 upstream/$UPSTREAM_BRANCH 到 main =="
          # -X ours        : 冲突段保留本地(你的定制)，非冲突段(上游新功能)照常合入
          # --allow-unrelated-histories : 首次合并两独立历史仓库时必须
          # --no-edit      : 自动生成合并信息，不弹编辑器
          if git merge "upstream/$UPSTREAM_BRANCH" -X ours --allow-unrelated-histories --no-edit; then
            echo "合并成功（-X ours 已自动裁决普通冲突）"
          else
            echo "::warning::-X ours 无法自动解决的冲突(modify/delete、rename/rename 等)，一律按本地版本(ours)裁决："
            # 对所有仍处于未合并状态的路径，按“本地版本”解决：
            #   本地已删除的文件 -> 保持删除(git rm)
            #   本地仍存在的文件 -> 取 ours 版本(git checkout --ours)
            git diff --name-only --diff-filter=U | while IFS= read -r p; do
              if git cat-file -e "HEAD:$p" 2>/dev/null; then
                git checkout --ours -- "$p" && git add -- "$p"
                echo "  保留本地版本: $p"
              else
                git rm -f -- "$p"
                echo "  保持删除(本地已删): $p"
              fi
            done
            git commit --no-edit || echo "无需要提交的冲突裁决，继续推送"
          fi

          echo "== 推送到 origin/main =="
          git push origin main

      - name: 失败提示
        if: failure()
        run: |
          echo "::error::同步上游失败（冲突已自动以本地版本解决；此处失败多为推送被拒，如分支保护）。"
          echo "请检查仓库分支保护规则，或改用带 write 权限的 PAT。"
          exit 1
